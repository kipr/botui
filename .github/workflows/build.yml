name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  botui:
    name: Build and launch botui
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The same commands contributors run locally, so CI and local builds match.
      - name: Build in Docker
        id: build
        run: |
          # The container runs as uid 1000 and the runner's checkout belongs
          # to another uid, so the output directories have to be writable.
          mkdir -p build deploy
          chmod a+rwx build deploy
          docker compose build
          set -o pipefail
          docker compose run --rm build-botui 2>&1 | tee build/build.log

      # Fails if botui crashes at startup or never shows a window on the
      # virtual display.
      - name: Launch and screenshot the home screen
        timeout-minutes: 5
        run: docker compose run --rm build-botui scripts/screenshot.sh

      # The checkout is fresh, so every file was compiled and every warning is
      # in the log. Runs even if the screenshot step failed. Case-insensitive
      # because uic prints "Warning:".
      - name: Check for compiler warnings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          if [ ! -s build/build.log ]; then
            echo "::error::build/build.log is missing or empty."
            exit 1
          fi
          if grep -iF ': warning: ' build/build.log; then
            echo "::error::botui's build printed the warnings above. Fix them before merging."
            exit 1
          fi

      - name: Upload screenshot and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: botui-screenshots
          path: build/screenshots/
          if-no-files-found: ignore
